# ============================================
# ALC Mailbox Monitor - Project Configuration
# ============================================
# Target: Thingy91x (nRF9151 + ADXL367)
# Network: LTE-M (Cat-M1)
# NCS Version: 3.1.0
# ============================================

# C++ Support
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=n
CONFIG_MINIMAL_LIBCPP=n

# Application Stack and Heap
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_EVENTS=y

# ===== Modem Library =====
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_ON_FAULT_RESET_MODEM=y
CONFIG_NRF_MODEM_LIB_TRACE=n
CONFIG_NRF_MODEM_LIB_HEAP_SIZE=2048
CONFIG_MODEM_KEY_MGMT=y
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y

# ===== LTE Link Control - LTE-M =====
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M=y

# ===== Networking =====
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_POSIX_API=y

# ===== MQTT =====
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MQTT_CLEAN_SESSION=y
# Note: Security tag is defined in code, not Kconfig.

# Fuel Gauge
CONFIG_SENSOR=y
CONFIG_CHARGER=y
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

# ===== I2C for ADXL367 =====
CONFIG_I2C=y

# ===== GPIO and PWM =====
CONFIG_GPIO=y
CONFIG_PWM=y

# ===== Logging =====
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y

# ===== Random Number Generator =====
CONFIG_ENTROPY_GENERATOR=y

# ===== Power Management =====
CONFIG_PM=n
CONFIG_REBOOT=y

# ===== Thread Configuration =====
CONFIG_THREAD_NAME=y

# ===== TF-M / Crypto =====
CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PARTITION_PLATFORM=y
CONFIG_TFM_CRYPTO_RNG_MODULE_ENABLED=y

# PSA Crypto for TLS.
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_RAW_DATA=y

# ===== Flash / Settings =====
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_SETTINGS=y
CONFIG_FCB=y
CONFIG_SETTINGS_FCB=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x4000

# ===== Debug =====
CONFIG_DEBUG=n
CONFIG_DEBUG_OPTIMIZATIONS=n
